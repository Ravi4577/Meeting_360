<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Meeting 360 — meeting intelligence, scheduling and customer interaction tracking, built with HTML, CSS and vanilla JavaScript." />
  <meta name="theme-color" content="#141a33" />
  <title>Meeting 360</title>

  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =======================================================================
       TOP NAVIGATION BAR
       The user chip is bound to the admin record — never hardcoded.
  ======================================================================== -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <button class="icon-btn topbar__burger" id="burgerBtn" type="button"
              aria-label="Open navigation menu" aria-expanded="false" aria-controls="primaryNav">
        <svg class="ico"><use href="#i-menu" /></svg>
      </button>

      <a class="brand" href="#/dashboard">
        <span class="brand__mark"><svg class="ico"><use href="#i-pulse" /></svg></span>
        <span class="brand__text">Meeting<span>360</span></span>
      </a>

      <nav class="mainnav" id="primaryNav" aria-label="Primary navigation">
        <ul class="mainnav__list" id="navList"><!-- rendered by script.js --></ul>
      </nav>

      <div class="topbar__actions">
        <!-- Create dropdown -->
        <div class="dropdown" data-dropdown>
          <button class="btn btn--create" type="button" data-dropdown-toggle aria-expanded="false" aria-haspopup="true">
            <svg class="ico"><use href="#i-plus" /></svg>
            <span class="btn__label">Create</span>
            <svg class="ico ico--xs dropdown__caret"><use href="#i-chevron" /></svg>
          </button>
          <div class="dropdown__menu dropdown__menu--right" role="menu" data-dropdown-menu hidden>
            <p class="dropdown__title">Quick create</p>
            <button class="dropdown__item" role="menuitem" type="button" data-action="schedule-meeting">
              <svg class="ico"><use href="#i-video" /></svg> Schedule Meeting</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:tasks">
              <svg class="ico"><use href="#i-task" /></svg> Action Item</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:notes">
              <svg class="ico"><use href="#i-note" /></svg> Meeting Note</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:followups">
              <svg class="ico"><use href="#i-repeat" /></svg> Follow-up</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:recordings">
              <svg class="ico"><use href="#i-mic" /></svg> Upload Recording</button>
            <div class="dropdown__sep" role="separator"></div>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new-contact">
              <svg class="ico"><use href="#i-user" /></svg> Contact</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:calls">
              <svg class="ico"><use href="#i-phone" /></svg> Call log</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="new:emails">
              <svg class="ico"><use href="#i-mail" /></svg> Email</button>
          </div>
        </div>

        <!-- Global search -->
        <div class="search" id="search">
          <button class="icon-btn" id="searchToggle" type="button" aria-label="Open search"
                  aria-expanded="false" aria-controls="searchPanel">
            <svg class="ico"><use href="#i-search" /></svg>
          </button>
          <div class="search__panel" id="searchPanel" hidden>
            <form class="search__form" id="searchForm" role="search" autocomplete="off">
              <svg class="ico search__icon"><use href="#i-search" /></svg>
              <input class="search__input" id="searchInput" type="search" name="q"
                     placeholder="Search meetings, contacts, notes, action items…" aria-label="Search Meeting 360"
                     aria-controls="searchResults" aria-expanded="false" role="combobox" />
              <button class="icon-btn icon-btn--sm" id="searchClose" type="button" aria-label="Close search">
                <svg class="ico"><use href="#i-close" /></svg>
              </button>
            </form>
            <ul class="search__results" id="searchResults" role="listbox" aria-label="Search results" hidden></ul>
          </div>
        </div>

        <!-- Notifications -->
        <div class="dropdown" data-dropdown>
          <button class="icon-btn icon-btn--badge" type="button" data-dropdown-toggle aria-expanded="false"
                  aria-haspopup="true" aria-label="Notifications">
            <svg class="ico"><use href="#i-bell" /></svg>
            <span class="badge" id="notifBadge" hidden>0</span>
          </button>
          <div class="dropdown__menu dropdown__menu--right dropdown__menu--wide" data-dropdown-menu hidden>
            <div class="dropdown__head">
              <p class="dropdown__title">Notifications</p>
              <div class="dropdown__head-actions">
                <button class="link-btn" type="button" id="markAllRead">Mark all read</button>
                <button class="link-btn link-btn--mute" type="button" id="clearNotifs">Clear</button>
              </div>
            </div>
            <ul class="notif-list" id="notifList"></ul>
          </div>
        </div>

        <!-- Admin profile -->
        <div class="dropdown" data-dropdown>
          <button class="userchip" type="button" data-dropdown-toggle aria-expanded="false" aria-haspopup="true">
            <span class="avatar avatar--sm" id="adminAvatar">AC</span>
            <span class="userchip__meta">
              <span class="userchip__name" id="adminName">Adrian Cole</span>
              <span class="userchip__role" id="adminRole">Administrator</span>
            </span>
            <svg class="ico ico--xs dropdown__caret"><use href="#i-chevron" /></svg>
          </button>
          <div class="dropdown__menu dropdown__menu--right" role="menu" data-dropdown-menu hidden>
            <div class="dropdown__user">
              <span class="avatar avatar--sm" id="adminAvatarMenu">AC</span>
              <div>
                <p class="dropdown__user-name" id="adminNameMenu">Adrian Cole</p>
                <p class="dropdown__user-mail" id="adminMailMenu">adrian.cole@meeting360.io</p>
              </div>
            </div>
            <div class="dropdown__sep" role="separator"></div>
            <button class="dropdown__item" role="menuitem" type="button" data-action="admin-view">
              <svg class="ico"><use href="#i-user" /></svg> View Profile</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="admin-edit">
              <svg class="ico"><use href="#i-edit" /></svg> Edit Profile</button>
            <button class="dropdown__item" role="menuitem" type="button" data-action="admin-settings">
              <svg class="ico"><use href="#i-settings" /></svg> Settings</button>
            <div class="dropdown__sep" role="separator"></div>
            <button class="dropdown__item dropdown__item--danger" role="menuitem" type="button" data-action="admin-logout">
              <svg class="ico"><use href="#i-logout" /></svg> Logout</button>
          </div>
        </div>
      </div>
    </div>
    <div class="nav-scrim" id="navScrim" hidden></div>
  </header>

  <!-- =======================================================================
       APPLICATION VIEW — every screen is rendered here by the router
  ======================================================================== -->
  <main class="page" id="main">
    <div id="view" class="view" role="region" aria-live="polite"></div>
  </main>

  <!-- Modal shell (content injected by openModal) -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal__head">
        <div class="modal__head-main">
          <span class="modal__icon" id="modalIcon" aria-hidden="true"></span>
          <div>
            <h2 class="modal__title" id="modalTitle">Title</h2>
            <p class="modal__sub" id="modalSub"></p>
          </div>
        </div>
        <button class="icon-btn" type="button" data-modal-close aria-label="Close dialog">
          <svg class="ico"><use href="#i-close" /></svg>
        </button>
      </header>
      <div class="modal__body" id="modalBody"></div>
      <footer class="modal__foot" id="modalFoot"></footer>
    </div>
  </div>

  <!-- Sign-out screen -->
  <div class="lock" id="lockScreen" hidden>
    <div class="lock__card card">
      <span class="lock__icon"><svg class="ico"><use href="#i-lock" /></svg></span>
      <h2>You are signed out</h2>
      <p>Your Meeting 360 session has ended. All of your data is safely stored on this device.</p>
      <button class="btn btn--primary" type="button" id="signBackIn">
        <svg class="ico"><use href="#i-logout" /></svg> Sign back in
      </button>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
